<!doctype html>
<html lang="fr" data-theme="sombre" data-motion="reduced">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title data-i18n="title"></title>
    <meta name="description" data-i18n-content="description" content="" />
    <!-- kitzy:seo -->
    <meta name="theme-color" content="#12302B" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/png" href="app/icons/favicon-64.png" />
    <link rel="apple-touch-icon" href="app/icons/apple-touch-icon.png" />
    <link rel="manifest" href="app/manifest.webmanifest" />
    <script>
      // App installée ouverte sur l'ancienne adresse : direction l'app, sans afficher cette page.
      if (matchMedia('(display-mode: standalone)').matches || navigator.standalone === true) {
        location.replace('app/');
      }
    </script>
  </head>
  <body>
    <a class="skip-link" href="#contenu" data-i18n="skip"></a>

    <header class="top">
      <a class="brand" href="./">Kitzy</a>
      <label class="lang">
        <span class="visually-hidden" data-i18n="language"></span>
        <select id="lang" class="lang__select">
          <option value="fr" lang="fr">Français</option>
          <option value="en" lang="en">English</option>
          <option value="lb" lang="lb">Lëtzebuergesch</option>
          <option value="de" lang="de">Deutsch</option>
          <option value="pt" lang="pt">Português</option>
        </select>
      </label>
      <a class="button button--small top__open" href="app/" data-i18n="openApp"></a>
    </header>

    <main id="contenu" tabindex="-1">
      <!-- Le soir tombe : la fenêtre du terrier s'allume, une seule fois au chargement. -->
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero__text">
          <h1 id="hero-title" class="hero__title" data-i18n="hero.title"></h1>
          <p class="hero__lead" data-i18n="hero.lead"></p>
          <p class="actions">
            <a class="button" href="app/" data-i18n="hero.open"></a>
            <a class="button button--ghost" href="#installer" data-i18n="hero.install"></a>
          </p>
        </div>
        <div class="stage" aria-hidden="true">
          <div class="stage__light"></div>
          <div class="stage__ground"></div>
          <img
            class="stage__hog"
            src="app/mascot/kitzy-lanterne.webp"
            alt=""
            width="640"
            height="1004"
          />
        </div>
      </section>

      <!-- La pièce maîtresse : la réserve se calcule sous les yeux. -->
      <section class="household" aria-labelledby="household-title">
        <div class="household__intro">
          <h2 id="household-title" class="title" data-i18n="household.title"></h2>
          <p class="lead" data-i18n="household.lead"></p>
        </div>
        <div class="household__board">
          <fieldset class="members">
            <legend class="members__legend" data-i18n="household.legend"></legend>
            <div class="member" data-member="adults" data-value="2">
              <span class="member__name" id="m-adults" data-i18n="household.members.adults"></span>
              <span class="stepper">
                <button type="button" class="stepper__btn" data-step="-1">−</button>
                <output class="stepper__value" aria-labelledby="m-adults">2</output>
                <button type="button" class="stepper__btn" data-step="1">+</button>
              </span>
            </div>
            <div class="member" data-member="children" data-value="1">
              <span
                class="member__name"
                id="m-children"
                data-i18n="household.members.children"
              ></span>
              <span class="stepper">
                <button type="button" class="stepper__btn" data-step="-1">−</button>
                <output class="stepper__value" aria-labelledby="m-children">1</output>
                <button type="button" class="stepper__btn" data-step="1">+</button>
              </span>
            </div>
            <div class="member" data-member="babies" data-value="0">
              <span class="member__name" id="m-babies" data-i18n="household.members.babies"></span>
              <span class="stepper">
                <button type="button" class="stepper__btn" data-step="-1">−</button>
                <output class="stepper__value" aria-labelledby="m-babies">0</output>
                <button type="button" class="stepper__btn" data-step="1">+</button>
              </span>
            </div>
            <div class="member" data-member="dogs" data-value="0">
              <span class="member__name" id="m-dogs" data-i18n="household.members.dogs"></span>
              <span class="stepper">
                <button type="button" class="stepper__btn" data-step="-1">−</button>
                <output class="stepper__value" aria-labelledby="m-dogs">0</output>
                <button type="button" class="stepper__btn" data-step="1">+</button>
              </span>
            </div>
            <div class="member" data-member="cats" data-value="1">
              <span class="member__name" id="m-cats" data-i18n="household.members.cats"></span>
              <span class="stepper">
                <button type="button" class="stepper__btn" data-step="-1">−</button>
                <output class="stepper__value" aria-labelledby="m-cats">1</output>
                <button type="button" class="stepper__btn" data-step="1">+</button>
              </span>
            </div>
          </fieldset>
          <div class="results" aria-live="polite" aria-atomic="true">
            <p class="result result--water">
              <span class="result__n" data-result="water">27,9</span>
              <span class="result__label" data-result-label="water"></span>
            </p>
            <p class="result">
              <span class="result__n" data-result="meals">27</span>
              <span class="result__label" data-result-label="meals"></span>
            </p>
            <p class="result" data-result-row="pets">
              <span class="result__n" data-result="pets">6</span>
              <span class="result__label" data-result-label="pets"></span>
            </p>
            <p class="result">
              <span class="result__n" data-result="bags">3</span>
              <span class="result__label" data-result-label="bags"></span>
            </p>
          </div>
        </div>
        <p class="household__note" data-i18n="household.note"></p>
        <p class="household__lists" data-i18n="household.lists"></p>
      </section>

      <section class="split" aria-labelledby="split-title">
        <div class="split__intro">
          <h2 id="split-title" class="title" data-i18n="split.title"></h2>
          <p class="lead" data-i18n="split.lead"></p>
        </div>
        <div class="split__home">
          <h3 class="split__title" data-i18n="split.home.title"></h3>
          <ul class="split__list">
            <li data-i18n="split.home.items.0"></li>
            <li data-i18n="split.home.items.1"></li>
            <li data-i18n="split.home.items.2"></li>
            <li data-i18n="split.home.items.3"></li>
          </ul>
        </div>
        <img
          class="split__hog"
          src="app/mascot/kitzy-sac.webp"
          alt=""
          width="640"
          height="1139"
          loading="lazy"
        />
        <div class="split__bag">
          <h3 class="split__title" data-i18n="split.bag.title"></h3>
          <ul class="split__list">
            <li data-i18n="split.bag.items.0"></li>
            <li data-i18n="split.bag.items.1"></li>
            <li data-i18n="split.bag.items.2"></li>
            <li data-i18n="split.bag.items.3"></li>
          </ul>
        </div>
      </section>

      <section class="buy" aria-labelledby="buy-title">
        <h2 id="buy-title" class="title" data-i18n="buy.title"></h2>
        <p class="lead" data-i18n="buy.text"></p>
        <ul class="tiers">
          <li class="tier">
            <span class="tier__mark" aria-hidden="true" data-i18n="buy.tiers.0.mark"></span>
            <span class="tier__name" data-i18n="buy.tiers.0.name"></span>
            <span class="tier__text" data-i18n="buy.tiers.0.text"></span>
          </li>
          <li class="tier">
            <span class="tier__mark" aria-hidden="true" data-i18n="buy.tiers.1.mark"></span>
            <span class="tier__name" data-i18n="buy.tiers.1.name"></span>
            <span class="tier__text" data-i18n="buy.tiers.1.text"></span>
          </li>
          <li class="tier">
            <span class="tier__mark" aria-hidden="true" data-i18n="buy.tiers.2.mark"></span>
            <span class="tier__name" data-i18n="buy.tiers.2.name"></span>
            <span class="tier__text" data-i18n="buy.tiers.2.text"></span>
          </li>
        </ul>
        <p class="buy__fair" data-i18n="buy.fair"></p>
      </section>

      <section class="reminders" aria-labelledby="reminders-title">
        <div class="reminders__intro">
          <h2 id="reminders-title" class="title" data-i18n="reminders.title"></h2>
          <p class="lead" data-i18n="reminders.lead"></p>
        </div>
        <ol class="agenda">
          <li class="agenda__item">
            <span class="agenda__when" data-i18n="reminders.samples.0.when"></span>
            <span class="agenda__what" data-i18n="reminders.samples.0.what"></span>
          </li>
          <li class="agenda__item">
            <span class="agenda__when" data-i18n="reminders.samples.1.when"></span>
            <span class="agenda__what" data-i18n="reminders.samples.1.what"></span>
          </li>
          <li class="agenda__item">
            <span class="agenda__when" data-i18n="reminders.samples.2.when"></span>
            <span class="agenda__what" data-i18n="reminders.samples.2.what"></span>
          </li>
        </ol>
        <div class="reminders__how">
          <p data-i18n="reminders.notify"></p>
          <p data-i18n="reminders.ics"></p>
        </div>
      </section>

      <section class="evening" aria-labelledby="evening-title">
        <div class="evening__intro">
          <h2 id="evening-title" class="title" data-i18n="evening.title"></h2>
          <p class="lead" data-i18n="evening.lead"></p>
        </div>
        <ol class="programme">
          <li class="programme__item">
            <span class="programme__time" data-i18n="evening.programme.0.time"></span>
            <h3 class="programme__title" data-i18n="evening.programme.0.title"></h3>
            <p class="programme__text" data-i18n="evening.programme.0.text"></p>
          </li>
          <li class="programme__item">
            <span class="programme__time" data-i18n="evening.programme.1.time"></span>
            <h3 class="programme__title" data-i18n="evening.programme.1.title"></h3>
            <p class="programme__text" data-i18n="evening.programme.1.text"></p>
          </li>
          <li class="programme__item">
            <span class="programme__time" data-i18n="evening.programme.2.time"></span>
            <h3 class="programme__title" data-i18n="evening.programme.2.title"></h3>
            <p class="programme__text" data-i18n="evening.programme.2.text"></p>
          </li>
          <li class="programme__item">
            <span class="programme__time" data-i18n="evening.programme.3.time"></span>
            <h3 class="programme__title" data-i18n="evening.programme.3.title"></h3>
            <p class="programme__text" data-i18n="evening.programme.3.text"></p>
          </li>
        </ol>
        <p class="evening__after" data-i18n="evening.after"></p>
      </section>

      <section class="privacy" aria-labelledby="privacy-title">
        <h2 id="privacy-title" class="privacy__title" data-i18n="privacy.title"></h2>
        <p class="privacy__text" data-i18n="privacy.text"></p>
      </section>

      <!-- Partager : une famille et un quartier prêts s'entraident mieux. -->
      <section class="together" aria-labelledby="together-title">
        <div class="together__text">
          <h2 id="together-title" class="together__title" data-i18n="together.title"></h2>
          <p class="together__lead" data-i18n="together.text"></p>
          <p class="actions">
            <button
              id="share-app"
              type="button"
              class="button"
              data-i18n="together.button"
            ></button>
          </p>
          <p id="share-state" class="together__state" role="status"></p>
        </div>
        <figure class="together__qr">
          <div class="together__code" role="img" data-i18n-label="together.qrLabel" aria-label="">
            <!-- kitzy:qr -->
          </div>
          <figcaption class="together__caption" data-i18n="together.qrHelp"></figcaption>
        </figure>
      </section>

      <section id="installer" class="install" aria-labelledby="install-title" tabindex="-1">
        <h2 id="install-title" class="title" data-i18n="install.title"></h2>
        <p class="lead" data-i18n="install.intro"></p>
        <p id="install-state" class="install__state" role="status"></p>
        <button
          id="install-now"
          type="button"
          class="button"
          hidden
          data-i18n="install.now"
        ></button>
        <ul class="platforms">
          <li class="platform" data-platform="android">
            <h3 class="platform__title">
              <span data-i18n="install.platforms.android.title"></span>
              <span class="platform__yours" data-i18n="install.yours"></span>
            </h3>
            <ol>
              <li data-i18n="install.platforms.android.steps.0"></li>
              <li data-i18n="install.platforms.android.steps.1"></li>
              <li data-i18n="install.platforms.android.steps.2"></li>
            </ol>
          </li>
          <li class="platform" data-platform="ios">
            <h3 class="platform__title">
              <span data-i18n="install.platforms.ios.title"></span>
              <span class="platform__yours" data-i18n="install.yours"></span>
            </h3>
            <ol>
              <li data-i18n="install.platforms.ios.steps.0"></li>
              <li data-i18n="install.platforms.ios.steps.1"></li>
              <li data-i18n="install.platforms.ios.steps.2"></li>
            </ol>
          </li>
          <li class="platform" data-platform="desktop">
            <h3 class="platform__title">
              <span data-i18n="install.platforms.desktop.title"></span>
              <span class="platform__yours" data-i18n="install.yours"></span>
            </h3>
            <ol>
              <li data-i18n="install.platforms.desktop.steps.0"></li>
              <li data-i18n="install.platforms.desktop.steps.1"></li>
              <li data-i18n="install.platforms.desktop.steps.2"></li>
            </ol>
          </li>
        </ul>
        <p class="install__browser">
          <span data-i18n="install.browser"></span>
          <a href="app/" data-i18n="install.browserLink"></a>
        </p>
      </section>
    </main>

    <footer class="footer">
      <p class="footer__credits">
        <span data-i18n="footer.studio.before"></span
        ><a href="https://geoffreycrofte.com">Crofte Studio</a
        ><span data-i18n="footer.studio.after"></span>
        <span data-i18n="footer.checkfox.before"></span><a href="https://checkfox.eu">CheckFox.eu</a
        ><span data-i18n="footer.checkfox.after"></span>
      </p>
      <p class="footer__source" data-i18n="footer.source"></p>
      <ul class="footer__links">
        <li><a href="app/confidentialite" data-i18n="footer.privacy"></a></li>
        <li><a href="app/transparence" data-i18n="footer.transparency"></a></li>
        <li>
          <a href="https://github.com/geoffreycrofte/kitzy-survival-kit" data-i18n="footer.project"></a>
        </li>
      </ul>
    </footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
