name: Déploiement GitHub Pages

# Le site ne part en ligne que si le CI de main est vert (lint, types, tests, bout en bout).
# workflow_dispatch reste là pour redéployer à la main, sans attendre le CI.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      # Racine du site. Sans domaine personnalisé : /kitzy-survival-kit/. Avec kitzy.lu : variable de dépôt KITZY_BASE à « / ».
      # La page de présentation est à cette racine, l'app juste en dessous, dans app/.
      KITZY_BASE: ${{ vars.KITZY_BASE || '/kitzy-survival-kit/' }}
      # Domaine définitif (kitzy.lu) : sert aussi à l'identité de l'app installée.
      KITZY_DOMAIN: ${{ vars.KITZY_DOMAIN }}
      # Web Push (service du VPS) : désactivé tant que ces variables de dépôt sont vides.
      VITE_KITZY_PUSH_URL: ${{ vars.KITZY_PUSH_URL }}
      VITE_KITZY_VAPID_KEY: ${{ vars.KITZY_VAPID_KEY }}
      # Affiliation Amazon : liens directs, non affiliés, tant que ces variables sont vides.
      VITE_KITZY_AMAZON_TAG_FR: ${{ vars.KITZY_AMAZON_TAG_FR }}
      VITE_KITZY_AMAZON_TAG_DE: ${{ vars.KITZY_AMAZON_TAG_DE }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Exactement le commit que le CI a vérifié, même si main a bougé depuis.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Domaine personnalisé
        if: vars.KITZY_DOMAIN != ''
        run: echo "${{ vars.KITZY_DOMAIN }}" > apps/web/dist/CNAME
      - run: touch apps/web/dist/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
