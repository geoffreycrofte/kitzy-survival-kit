name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Sans domaine personnalisé : /survival-kit/. Avec kitzy.lu : mettre la variable de dépôt KITZY_BASE à « / ».
      KITZY_BASE: ${{ vars.KITZY_BASE || '/survival-kit/' }}
      # Domaine définitif (kitzy.lu) : sert aussi à l'identité de l'app installée.
      KITZY_DOMAIN: ${{ vars.KITZY_DOMAIN }}
      # Web Push (service du VPS) : désactivé tant que ces variables de dépôt sont vides.
      VITE_KITZY_PUSH_URL: ${{ vars.KITZY_PUSH_URL }}
      VITE_KITZY_VAPID_KEY: ${{ vars.KITZY_VAPID_KEY }}
      # Affiliation Amazon : liens directs, non affiliés, tant que ces variables sont vides.
      VITE_KITZY_AMAZON_TAG_FR: ${{ vars.KITZY_AMAZON_TAG_FR }}
      VITE_KITZY_AMAZON_TAG_DE: ${{ vars.KITZY_AMAZON_TAG_DE }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Domaine personnalisé
        if: vars.KITZY_DOMAIN != ''
        run: echo "${{ vars.KITZY_DOMAIN }}" > apps/web/dist/CNAME
      - run: touch apps/web/dist/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
